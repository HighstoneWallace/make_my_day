name: Deploy MakeMyDay

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Get EC2 host from SSM
        run: |
          EC2_HOST=$(aws ssm get-parameter \
            --name "/makemyday/ec2_host" \
            --region eu-central-1 \
            --query "Parameter.Value" \
            --output text)
          echo "EC2_HOST=$EC2_HOST" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: makemyday
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/"
          target: "/home/ubuntu/k8s"
          strip_components: 1

      - name: Restore Google credentials
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ssm get-parameter \
              --name "/makemyday/credentials_json" \
              --with-decryption \
              --region eu-central-1 \
              --query "Parameter.Value" \
              --output text > ~/credentials.json
            aws ssm get-parameter \
              --name "/makemyday/token_json" \
              --with-decryption \
              --region eu-central-1 \
              --query "Parameter.Value" \
              --output text > ~/token.json
            echo "Credentials restored"

      - name: Apply Kubernetes manifests
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config
            echo "Waiting for k3s to be ready..."
            timeout 120 bash -c 'until kubectl get nodes 2>/dev/null | grep -q Ready; do sleep 5; done'
            echo "k3s is ready"
            
            # Clone or pull repo
            if [ -d ~/make_my_day ]; then
              cd ~/make_my_day && git pull
            else
              git clone https://github.com/YOUR_USERNAME/make_my_day.git ~/make_my_day
            fi
            
            kubectl apply -f ~/make_my_day/k8s/

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config
            # Refresh ECR credentials for Kubernetes
            kubectl create secret docker-registry ecr-secret \
              --docker-server=$(aws ecr describe-registry --region eu-central-1 --query registryId --output text).dkr.ecr.eu-central-1.amazonaws.com \
              --docker-username=AWS \
              --docker-password=$(aws ecr get-login-password --region eu-central-1) \
              --namespace makemyday \
              --dry-run=client -o yaml | kubectl apply -f -
            # Update the image
            kubectl set image deployment/makemyday-deployment \
              makemyday=$IMAGE \
              --namespace makemyday
            # Wait for rollout
            kubectl rollout status deployment/makemyday-deployment \
              --namespace makemyday \
              --timeout=120s