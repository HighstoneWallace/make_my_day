apiVersion: apps/v1
kind: Deployment
metadata:
  name: makemyday
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: makemyday
  template:
    metadata:
      labels:
        app: makemyday
    spec:
      containers:
        - name: makemyday
          image: 003720227935.dkr.ecr.eu-central-1.amazonaws.com/makemyday/makemyday:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENV
              value: "production"
          volumeMounts:
            - name: google-credentials
              mountPath: /app/credentials.json
              subPath: credentials.json
            - name: google-token
              mountPath: /app/token.json
              subPath: token.json
      volumes:
        - name: google-credentials
          hostPath:
            path: /home/ubuntu/credentials.json
            type: File
        - name: google-token
          hostPath:
            path: /home/ubuntu/token.json
            type: File
